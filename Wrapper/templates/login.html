<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            background: radial-gradient(circle at center, #0d081b 0%, #030107 100%);
            overflow: hidden;
        }
        .glow-border {
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.15), inset 0 0 15px rgba(236, 72, 153, 0.05);
            border: 1px solid rgba(236, 72, 153, 0.25);
        }
        .neon-text {
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
        }
        img {
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <div class="absolute w-96 h-96 bg-pink-600 rounded-full blur-[140px] opacity-10 -top-20 -left-20 animate-pulse"></div>
    <div class="absolute w-96 h-96 bg-purple-600 rounded-full blur-[140px] opacity-10 -bottom-20 -right-20 animate-pulse"></div>

    <div class="z-10 w-full max-w-md p-8 rounded-2xl bg-slate-950/70 backdrop-blur-2xl glow-border animate__animated animate__zoomIn">
        
        <div class="flex justify-center mb-6">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full blur opacity-70 group-hover:opacity-100 transition duration-1000 group-hover:duration-200 animate-tilt"></div>
                <img src="/static/images/encrypted.jpg" ondragstart="return false;" class="relative w-24 h-24 rounded-full object-cover border border-pink-500/50 shadow-2xl animate__animated animate__pulse animate__infinite animate__slow">
            </div>
        </div>

        <h2 class="text-2xl font-black text-center tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400 neon-text mb-1">
            GATEWAY ACCESS
        </h2>
        <p class="text-center text-slate-500 text-xs uppercase tracking-widest mb-6">BENJA HEX API</p>

        {% if error %}
            <div class="flex items-center gap-2 p-3 mb-4 text-xs font-mono text-red-400 bg-red-950/30 border border-red-900/50 rounded-xl animate__animated animate__shakeX">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-[10px] font-mono font-bold uppercase tracking-widest text-pink-400">Master Password</label>
                    <svg class="w-3.5 h-3.5 text-pink-500/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <div class="relative flex items-center">
                    <input type="password" name="password" id="loginPass" required placeholder="ENTER PHRASE" 
                           class="input-glow w-full pl-4 pr-12 py-3 text-sm text-center text-white bg-black/60 border border-slate-800 rounded-xl focus:outline-none focus:border-pink-500/80 transition-all duration-300 tracking-widest font-mono">
                    <button type="button" onclick="togglePass('loginPass', 'eyeIcon')" class="absolute right-4 text-slate-500 hover:text-pink-500 focus:outline-none">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" 
                    class="group relative w-full py-3 font-bold text-xs text-white uppercase tracking-widest rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 transition-all duration-300 transform scale-[1.01] active:scale-[0.99] shadow-lg shadow-pink-950/30 flex items-center justify-center gap-2">
                <span>Authorize Terminal</span>
                <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </button>
        </form>
    </div>

    <script>
        function togglePass(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === "password") {
                input.type = "text";
                eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>';
            } else {
                input.type = "password";
                eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        }
    </script>
</body>
</html>
